name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: AST parse (syntax sanity)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errs = []
          for d in ('app', 'tests'):
              for p in pathlib.Path(d).rglob('*.py'):
                  try:
                      ast.parse(p.read_text())
                  except SyntaxError as e:
                      errs.append((str(p), e.lineno, e.msg))
          if errs:
              for e in errs: print(e)
              sys.exit(1)
          print('OK')
          PY

      - name: Import smoke
        run: python -c "from app.main import create_app; create_app()"

      - name: pytest (unit + integration)
        run: pytest -v --tb=short

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit (high+ severity)
        run: npm audit --production --audit-level=high || true

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  e2e-smoke:
    name: E2E smoke (docker compose)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    # Only run on main pushes or when manually triggered; PR CI stays fast.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Boot stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres neo4j backend proxy

      - name: Wait for backend /health (direct)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker compose logs backend | tail -120
          exit 1

      - name: Verify Caddy front-door routing
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health >/dev/null 2>&1; then
              echo "proxy up"; exit 0
            fi
            sleep 2
          done
          echo "proxy never came up"
          docker compose logs proxy | tail -120
          exit 1

      - name: Run E2E suite inside the backend container (via proxy)
        run: |
          docker compose exec -T -e CNG_E2E=1 -e CNG_BASE_URL=http://proxy backend \
            pytest tests/test_e2e_smoke.py -v

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  playwright-e2e:
    name: Playwright browser E2E
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Boot stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for backend + frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:5173 >/dev/null 2>&1; then
              echo "stack up"; exit 0
            fi
            sleep 2
          done
          echo "stack never came up"
          docker compose logs | tail -200
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test --reporter=line
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
