# Production overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from dev:
# - No bind mounts of source code into containers; no uvicorn --reload
# - The `proxy` service is rebuilt from caddy/Dockerfile.prod so it carries the
#   compiled frontend statics AND proxies /api → backend in one container.
#   Auto-HTTPS via Let's Encrypt when CNG_DOMAIN is a real public hostname.
# - The `frontend` dev service is disabled — only the proxy is exposed externally.
# - Backend, Postgres, Neo4j stay on the internal docker network.

services:
  postgres:
    ports: !reset []
    restart: always

  neo4j:
    ports: !reset []
    restart: always

  backend:
    volumes:
      - vaultdata:/data/vault
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips=*
    environment:
      CORS_ORIGINS: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN env required for prod (e.g. https://cng.example.com)}
      API_KEY: ${BACKEND_API_KEY:?BACKEND_API_KEY env required for prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: !reset []
    restart: always

  frontend:
    # The dev-mode Vite server isn't used in production. Disable it without removing
    # the key from the merged config — `profiles` makes it opt-in only.
    profiles: ["never"]

  proxy:
    image: !reset null
    build:
      context: .
      dockerfile: caddy/Dockerfile.prod
      args:
        # Bake the public URL into the bundle so axios uses absolute URLs
        # (relative would also work; explicit makes CDN / SSR / debug easier).
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: cng-proxy
    environment:
      # Two deployment shapes — see caddy/Caddyfile.prod for the full
      # explanation. Pick by setting CNG_DOMAIN:
      #
      # 1) Direct-to-internet (default):
      #       CNG_DOMAIN=cng.example.com  (real, publicly resolvable)
      #       CADDY_EMAIL=ops@example.com (renewal notifications)
      #    Caddy fetches a Let's Encrypt cert and serves HTTPS on :443.
      #
      # 2) Behind another reverse proxy (nginx, ELB, Cloudflare tunnel…):
      #       CNG_DOMAIN=:80              (port-only bind, no TLS, no ACME)
      #    Caddy serves plain HTTP. Trusted upstream X-Forwarded-* headers
      #    flow through to the backend.
      #
      # CNG_DOMAIN defaults to "localhost" — fine for kicking the tyres,
      # not a real deployment.
      CNG_DOMAIN: ${CNG_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
      CNG_TRUSTED_PROXIES: ${CNG_TRUSTED_PROXIES:-private_ranges}
      CNG_HSTS: ${CNG_HSTS:-max-age=31536000; includeSubDomains}
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    ports: !override
      - "${PROXY_HTTP_PORT:-80}:80"
      # HTTPS port only used in auto-TLS mode; harmless to map either way.
      - "${PROXY_HTTPS_PORT:-443}:443"
    depends_on: !override
      backend:
        condition: service_healthy
    restart: always
