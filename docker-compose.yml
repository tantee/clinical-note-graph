services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cng-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cngpass}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_graph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pass -d explicitly. Without it pg_isready defaults to a database
      # named after the user (PGDATABASE → POSTGRES_USER → 'cng'), which
      # doesn't exist and causes a 'FATAL: database "cng" does not exist'
      # in the postgres log every interval. The check still passes (the
      # server IS reachable), but the noise is misleading on first boot.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cng} -d ${POSTGRES_DB:-clinical_graph}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: cng-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpass}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cng-backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cngpass}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_graph}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpass}
      VAULT_PATH: /data/vault
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MODEL_EXTRACT: ${AI_MODEL_EXTRACT-}
      AI_MODEL_SUMMARY: ${AI_MODEL_SUMMARY-}
      AI_MODEL_CODING: ${AI_MODEL_CODING-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      API_KEY: ${BACKEND_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEIDENTIFY_LEVEL: ${DEIDENTIFY_LEVEL:-safe_harbor}
      DEIDENTIFY_NER_THRESHOLD: ${DEIDENTIFY_NER_THRESHOLD:-0.5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - vaultdata:/data/vault
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: cng-frontend
    depends_on:
      - backend
    environment:
      # Empty by default — axios uses relative /api/... URLs so the API is
      # resolved against whichever origin served the page (the Caddy proxy).
      # Note the `-` (not `:-`) so an explicit empty string in .env stays empty.
      VITE_API_BASE: ${VITE_API_BASE-}
      # Vite verbosity knobs. Bump to debug noisy issues like blocked
      # host headers or HMR drops — see docs/troubleshooting.md.
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
      VITE_DEBUG: ${VITE_DEBUG:-}
      # When the dev server lives behind a custom domain (e.g. Caddy →
      # public hostname), set VITE_ALLOWED_HOSTS to a comma-separated
      # list so Vite stops blocking those host headers. Default is 'all'.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    container_name: cng-proxy
    depends_on:
      - backend
      - frontend
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  vaultdata:
  caddydata:
  caddyconfig:
